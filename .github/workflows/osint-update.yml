name: OSINT Ukraine - NPU
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
concurrency:
  group: osint-npu
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # Исправлено на v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Можно указать нужную версию
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Если у тебя есть requirements.txt, раскомментируй строку ниже:
          # pip install -r requirements.txt
          # Или укажи нужные пакеты вручную, например:
          # pip install requests
          
      - name: Collect official NPU publications
        run: python3 scripts/collect_npu.py
        
      - name: Commit updated events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore: update OSINT events"; git push; fi
