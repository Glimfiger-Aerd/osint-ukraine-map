<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OSINT Ukraine Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    
    <!-- Версия для CSS, чтобы сбросить кэш стилей -->
    <link rel="stylesheet" href="style.css?v=2">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="header">
        <div class="title-row">
            <h1>🇺🇦 OSINT Ukraine</h1>
            <span id="counter" class="total-counter">0</span>
        </div>
        <div id="date" class="update-date">Загрузка...</div>
        
        <div id="filters" class="filters">
            <input type="date" id="calendar">
            <button class="active" data-filter="all">Все</button>
            <button data-filter="hit">🔴 Прилёты</button>
            <button data-filter="debris">🟠 Обломки</button>
            <button data-filter="damage">🔥 Повреждения</button>
        </div>
    </div>

    <div id="map"></div>

    <div id="card" class="card-container">
        <h2>Выберите событие</h2>
        <p style="color: var(--hint-color); font-size: 14px;">Нажмите на маркер на карте, чтобы посмотреть сводку.</p>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    
    <!-- Версия v8 для JS -->
    <script src="app.js?v=8"></script>
</body>
</html>
