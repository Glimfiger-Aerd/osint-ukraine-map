<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OSINT Ukraine Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="header">
        <div class="title-row">
            <h1>🇺🇦 OSINT Ukraine</h1>
            <span id="counter" class="total-counter">0</span>
        </div>
        <div id="date" class="update-date">Загрузка...</div>
        
        <div id="filters" class="filters" style="display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px;">
            <!-- Календарь для архива -->
            <input type="date" id="calendar" style="padding: 6px; border-radius: 8px; border: 1px solid #ccc; font-family: inherit; margin-bottom: 5px;">
            
            <button class="active" data-filter="all">Все</button>
            <button data-filter="hit">🔴 Прилёты</button>
            <button data-filter="debris">🟠 Обломки</button>
            <button data-filter="damage">🔥 Повреждения</button>
        </div>
    </div>

    <div id="map"></div>

    <div id="card" class="card-container">
        <h2>Выберите событие</h2>
        <p>Нажмите на маркер на карте, чтобы посмотреть сводку.</p>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    
    <!-- Версия v7 для гарантированного обхода кэша Telegram -->
    <script src="app.js?v=7"></script>
</body>
</html>
