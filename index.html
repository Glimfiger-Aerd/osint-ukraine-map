<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OSINT Ukraine Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css?v=4">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="header">
        <div class="title-row">
            <h1>🇺🇦 OSINT Ukraine</h1>
            <span id="counter" class="total-counter">0</span>
        </div>
        <div id="date" class="update-date">Загрузка...</div>
        
        <div id="filters" class="filters">
            <input type="date" id="calendar">
            <button class="active" data-filter="all">Все</button>
            <button data-filter="hit">🔴 Прилёты</button>
            <button data-filter="damage">🔥 Повреждения</button>
        </div>
        
        <!-- Новый ряд фильтров для оружия -->
        <div id="weapon-filters" class="filters" style="margin-top: 8px;">
            <button data-filter="drone">🛸 БПЛА</button>
            <button data-filter="missile">🚀 Ракеты</button>
            <button data-filter="bomb">💣 КАБ</button>
            <button id="btn-analytics" style="background: #10b981; color: white; border: none; margin-left: auto;">📊 Аналитика</button>
        </div>
    </div>

    <div id="map"></div>

    <div id="card" class="card-container">
        <h2>Выберите событие</h2>
        <p style="color: var(--hint-color); font-size: 14px;">Нажмите на маркер на карте, чтобы посмотреть сводку.</p>
    </div>

    <div id="analyticsModal" class="modal">
        <div class="modal-content">
            <span id="closeModal" class="modal-close">&times;</span>
            <h3 style="margin-top:0;">Активность за месяц</h3>
            <div style="height: 250px; width: 100%;"><canvas id="chart"></canvas></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="app.js?v=10"></script>
</body>
</html>
