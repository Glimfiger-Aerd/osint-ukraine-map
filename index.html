<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>OSINT Ukraine</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header>
  <div><strong>🇺🇦 OSINT Ukraine</strong><small id="date">Загрузка данных…</small></div>
  <b id="counter">0</b>
</header>

<nav id="filters" aria-label="Фильтры">
  <button class="active" data-filter="all">Все</button>
  <button data-filter="hit">🔴 Прилёты</button>
  <button data-filter="debris">🟠 Обломки</button>
  <button data-filter="damage">🔥 Повреждения</button>
  <button data-filter="injured">🩹 Раненые</button>
  <button data-filter="dead">⚫ Погибшие</button>
</nav>

<main>
  <div id="map"></div>
  <section id="card" class="card">
    <h2>Карта Украины</h2>
    <p>Нажмите на область или маркер события.</p>
  </section>
</main>

<footer>
  Источники и статус проверки отображаются в карточках. Точные координаты целей и маршруты БПЛА не отображаются.
</footer>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="events.json" type="application/json" id="events-data"></script>
<script src="app.js"></script>
</body>
</html>
